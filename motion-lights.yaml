blueprint:
  name: Motion-activated lights
  description: >-
    Turn lights on with presence (unless manually switched off recently),
    and off after all sensors have been clear for N minutes.
    Optional: button gestures to switch between auto (motion-controlled)
    and manual (motion ignored). Running the automation manually resets to auto.
    Mode resets to auto on restart or scene reload.
  domain: automation
  input:
    presence_sensors:
      name: Presence sensors
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    target_lights:
      name: Lights / switches
      selector:
        entity:
          domain: [light, switch]
          multiple: true
    off_delay:
      name: Turn off after clear for (minutes)
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    manual_grace:
      name: Manual-off grace period (seconds)
      description: Don't turn back on if lights were switched off this recently.
      default: 5
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    on_conditions:
      name: Extra conditions to turn ON
      default: []
      selector:
        condition: {}
    off_conditions:
      name: Extra conditions to turn OFF
      description: e.g. door must be open
      default: []
      selector:
        condition: {}

    mode_section:
      name: Auto / manual mode (optional)
      icon: mdi:motion-sensor
      collapsed: true
      input:
        auto_buttons:
          name: Auto buttons
          description: Matter button event entities (e.g. event.kitchen_switch_up)
          default: []
          selector:
            entity:
              domain: event
              multiple: true
        auto_action:
          name: Auto gesture
          default: multi_press_3
          selector:
            select:
              custom_value: true
              options: &press_types
                - multi_press_1
                - multi_press_2
                - multi_press_3
                - multi_press_4
                - multi_press_5
                - long_press
                - long_release
                - initial_press
                - short_release
        manual_buttons:
          name: Manual buttons
          default: []
          selector:
            entity:
              domain: event
              multiple: true
        manual_action:
          name: Manual gesture
          default: multi_press_3
          selector:
            select:
              custom_value: true
              options: *press_types
        feedback_enabled:
          name: Flash feedback
          description: >-
            Flash lights when a gesture is used.
            Auto = 2 green blinks, manual = 1 red blink.
            Non-color lights and switches just blink.
          default: true
          selector:
            boolean: {}
        feedback_lights:
          name: Feedback lights
          description: >-
            Leave empty to flash the target lights.
            Don't include both a smart bulb and the switch that powers it.
          default: []
          selector:
            entity:
              domain: [light, switch]
              multiple: true

mode: queued
max: 10
max_exceeded: silent
trace:
  stored_traces: 20

variables:
  presence_sensors: !input presence_sensors
  target_lights: !input target_lights
  off_delay: !input off_delay
  manual_grace: !input manual_grace
  auto_action: !input auto_action
  manual_action: !input manual_action
  feedback_enabled: !input feedback_enabled
  feedback_input: !input feedback_lights
  feedback_lights: >-
    {{ feedback_input if feedback_input | length > 0 else target_lights }}
  scene_base: "{{ this.entity_id | replace('.', '_') }}"
  mode_flag: "scene.{{ scene_base }}_manual"

triggers:
  - trigger: state
    entity_id: !input presence_sensors
    to: "on"
    id: motion
  - trigger: state
    entity_id: !input presence_sensors
    to: "off"
    for:
      minutes: !input off_delay
    id: clear
  - trigger: state
    entity_id: !input auto_buttons
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    id: set_auto
  - trigger: state
    entity_id: !input manual_buttons
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    id: set_manual

actions:
  # Read mode when the run actually starts (not at trigger time),
  # so queued runs never act on stale state
  - variables:
      light_mode: >-
        {{ 'manual' if mode_flag in (states.scene | map(attribute='entity_id') | list)
           else 'auto' }}

  - choose:
      # ---- Manual run of the automation = reset to auto ----
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform is none }}"
        sequence:
          - if: "{{ light_mode == 'manual' }}"
            then:
              - action: scene.delete
                target:
                  entity_id: "{{ mode_flag }}"

      # ---- Mode gestures ----
      - conditions:
          - condition: trigger
            id: [set_auto, set_manual]
          - condition: template
            value_template: >-
              {{ trigger.to_state is not none and trigger.from_state is not none
                 and trigger.to_state.attributes.event_type ==
                 (auto_action if trigger.id == 'set_auto' else manual_action) }}
          # Ignore duplicate events (some switches send each multi-press twice)
          - condition: template
            value_template: >-
              {{ trigger.from_state.attributes.event_type != trigger.to_state.attributes.event_type
                 or (as_timestamp(trigger.to_state.state)
                     - as_timestamp(trigger.from_state.state)) > 1 }}
        sequence:
          - variables:
              new_mode: "{{ 'auto' if trigger.id == 'set_auto' else 'manual' }}"
              changed: "{{ new_mode != light_mode }}"
              flash_color: "{{ [0, 255, 0] if new_mode == 'auto' else [255, 0, 0] }}"
              flash_count: "{{ 2 if new_mode == 'auto' else 1 }}"

          # ---- Update the in-memory mode flag ----
          - if: "{{ changed and new_mode == 'manual' }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ scene_base }}_manual"
                  snapshot_entities: "{{ [this.entity_id] }}"
          - if: "{{ changed and new_mode == 'auto' }}"
            then:
              - action: scene.delete
                target:
                  entity_id: "{{ mode_flag }}"
              # Catch up: someone's there, so turn on now (before the flash, so no blip)
              - if:
                  - condition: template
                    value_template: >-
                      {{ expand(presence_sensors) | selectattr('state', 'eq', 'on')
                         | list | count > 0 }}
                  - condition: and
                    conditions: !input on_conditions
                then:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ target_lights }}"

          # ---- Flash feedback ----
          - variables:
              flash_lights: >-
                {{ expand(feedback_lights) | selectattr('domain', 'eq', 'light')
                   | rejectattr('state', 'in', ['unavailable', 'unknown'])
                   | map(attribute='entity_id') | list }}
              flash_switches: >-
                {{ expand(feedback_lights) | selectattr('domain', 'eq', 'switch')
                   | rejectattr('state', 'in', ['unavailable', 'unknown'])
                   | map(attribute='entity_id') | list }}
              fb_entities: "{{ flash_lights + flash_switches }}"
              fb_was_off: >-
                {{ expand(fb_entities) | selectattr('state', 'eq', 'off')
                   | map(attribute='entity_id') | list }}
          - if: "{{ feedback_enabled and fb_entities | length > 0 }}"
            then:
              # Turn off lights on first (in their normal color) so the snapshot
              # captures their real state
              - if: "{{ fb_was_off | length > 0 }}"
                then:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ fb_was_off }}"
                  - wait_template: >-
                      {{ expand(fb_was_off) | selectattr('state', 'eq', 'off')
                         | list | count == 0 }}
                    timeout: "00:00:02"
                    continue_on_timeout: true
                  - delay:
                      milliseconds: 300
              - action: scene.create
                data:
                  scene_id: "{{ scene_base }}_flash"
                  snapshot_entities: "{{ fb_entities }}"
              - repeat:
                  count: "{{ flash_count }}"
                  sequence:
                    - if: "{{ flash_lights | length > 0 }}"
                      then:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ flash_lights }}"
                          data:
                            rgb_color: "{{ flash_color }}"
                            brightness: 255
                            transition: 0
                    - if: "{{ flash_switches | length > 0 }}"
                      then:
                        - action: switch.turn_on
                          target:
                            entity_id: "{{ flash_switches }}"
                    - delay:
                        milliseconds: 200
                    # Leave lights ON after the last blink so the restore applies while on
                    # (Matter bulbs often ignore color changes while off)
                    - if: "{{ repeat.index < flash_count | int }}"
                      then:
                        - if: "{{ flash_lights | length > 0 }}"
                          then:
                            - action: light.turn_off
                              target:
                                entity_id: "{{ flash_lights }}"
                              data:
                                transition: 0
                        - if: "{{ flash_switches | length > 0 }}"
                          then:
                            - action: switch.turn_off
                              target:
                                entity_id: "{{ flash_switches }}"
                        - delay:
                            milliseconds: 150
              - action: scene.turn_on
                target:
                  entity_id: "scene.{{ scene_base }}_flash"
                data:
                  transition: 0
              - delay:
                  milliseconds: 300
              - if: "{{ fb_was_off | length > 0 }}"
                then:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ fb_was_off }}"

          # ---- Catch up: room's been clear for the full delay, so turn off now ----
          - if:
              - condition: template
                value_template: >-
                  {% set sensors = expand(presence_sensors) %}
                  {{ changed and new_mode == 'auto'
                     and sensors | selectattr('state', 'eq', 'on') | list | count == 0
                     and sensors | selectattr('last_changed', 'gt',
                          now() - timedelta(minutes=off_delay)) | list | count == 0 }}
              - condition: and
                conditions: !input off_conditions
            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: "{{ target_lights }}"

      # ---- Motion ----
      - conditions:
          - condition: trigger
            id: motion
          - condition: template
            value_template: "{{ light_mode == 'auto' }}"
          - condition: template
            value_template: >-
              {% set lights = expand(target_lights) %}
              {{ lights | selectattr('state', 'eq', 'on') | list | count > 0
                 or lights | selectattr('last_changed', 'gt',
                      now() - timedelta(seconds=manual_grace)) | list | count == 0 }}
          - condition: and
            conditions: !input on_conditions
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ target_lights }}"

      # ---- Clear ----
      - conditions:
          - condition: trigger
            id: clear
          - condition: template
            value_template: "{{ light_mode == 'auto' }}"
          - condition: template
            value_template: >-
              {% set sensors = expand(presence_sensors) %}
              {{ sensors | selectattr('state', 'eq', 'on') | list | count == 0
                 and sensors | selectattr('last_changed', 'gt',
                      now() - timedelta(minutes=off_delay)) | list | count == 0 }}
          - condition: and
            conditions: !input off_conditions
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ target_lights }}"
