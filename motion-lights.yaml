blueprint:
  name: Motion-activated lights
  description: >-
    Turn lights on with presence (unless manually switched off recently),
    and off after all sensors have been clear for N minutes.
    Optional: button gestures to lock lights on (no auto-off) or off (ignore motion).
    Repeat the same gesture to unlock. Running the automation manually resets the lock.
    Lock state resets to auto on restart.
  domain: automation
  input:
    presence_sensors:
      name: Presence sensors
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    target_lights:
      name: Lights / switches
      selector:
        entity:
          domain: [light, switch]
          multiple: true
    off_delay:
      name: Turn off after clear for (minutes)
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    manual_grace:
      name: Manual-off grace period (seconds)
      description: Don't turn back on if lights were switched off this recently.
      default: 5
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    on_conditions:
      name: Extra conditions to turn ON
      default: []
      selector:
        condition: {}
    off_conditions:
      name: Extra conditions to turn OFF
      description: e.g. door must be open
      default: []
      selector:
        condition: {}

    lock_section:
      name: Button lock (optional)
      icon: mdi:lock
      collapsed: true
      input:
        lock_on_buttons:
          name: Lock-ON buttons
          description: Matter button event entities (e.g. event.kitchen_switch_up)
          default: []
          selector:
            entity:
              domain: event
              multiple: true
        lock_on_action:
          name: Lock-ON gesture
          description: Repeat this gesture to unlock.
          default: multi_press_3
          selector:
            select:
              custom_value: true
              options: &press_types
                - multi_press_1
                - multi_press_2
                - multi_press_3
                - multi_press_4
                - multi_press_5
                - long_press
                - long_release
                - initial_press
                - short_release
        lock_off_buttons:
          name: Lock-OFF buttons
          default: []
          selector:
            entity:
              domain: event
              multiple: true
        lock_off_action:
          name: Lock-OFF gesture
          description: Repeat this gesture to unlock.
          default: multi_press_3
          selector:
            select:
              custom_value: true
              options: *press_types
        feedback_enabled:
          name: Flash feedback
          description: >-
            Flash lights when the lock changes.
            Lock on = 2 green blinks, lock off = 2 red blinks,
            unlock = 1 blink in the light's own color.
            Non-color lights and switches just blink.
          default: true
          selector:
            boolean: {}
        feedback_lights:
          name: Feedback lights
          description: >-
            Leave empty to flash the target lights.
            Don't include both a smart bulb and the switch that powers it.
          default: []
          selector:
            entity:
              domain: [light, switch]
              multiple: true

mode: queued
max: 10
max_exceeded: silent
trace:
  stored_traces: 20

variables:
  presence_sensors: !input presence_sensors
  target_lights: !input target_lights
  off_delay: !input off_delay
  manual_grace: !input manual_grace
  lock_on_action: !input lock_on_action
  lock_off_action: !input lock_off_action
  feedback_enabled: !input feedback_enabled
  feedback_input: !input feedback_lights
  feedback_lights: >-
    {{ feedback_input if feedback_input | length > 0 else target_lights }}
  lock_base: "{{ this.entity_id | replace('.', '_') }}"

triggers:
  - trigger: state
    entity_id: !input presence_sensors
    to: "on"
    id: motion
  - trigger: state
    entity_id: !input presence_sensors
    to: "off"
    for:
      minutes: !input off_delay
    id: clear
  - trigger: state
    entity_id: !input lock_on_buttons
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    id: lock_on
  - trigger: state
    entity_id: !input lock_off_buttons
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    id: lock_off

actions:
  # Read lock state when the run actually starts (not at trigger time),
  # so queued runs never act on stale state
  - variables:
      lock_mode: >-
        {%- set scenes = states.scene | map(attribute='entity_id') | list -%}
        {%- set b = 'scene.' ~ lock_base -%}
        {{ 'locked_on' if (b ~ '_locked_on') in scenes
           else 'locked_off' if (b ~ '_locked_off') in scenes
           else 'auto' }}

  - choose:
      # ---- Manual run = reset lock to auto ----
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform is none }}"
        sequence:
          - if: "{{ lock_mode != 'auto' }}"
            then:
              - action: scene.delete
                target:
                  entity_id: "scene.{{ lock_base }}_{{ lock_mode }}"

      # ---- Lock gestures ----
      - conditions:
          - condition: trigger
            id: [lock_on, lock_off]
          - condition: template
            value_template: >-
              {{ trigger.to_state is not none and trigger.from_state is not none
                 and trigger.to_state.attributes.event_type ==
                 (lock_on_action if trigger.id == 'lock_on' else lock_off_action) }}
          # Ignore duplicate events (some switches send each multi-press twice)
          - condition: template
            value_template: >-
              {{ trigger.from_state.attributes.event_type != trigger.to_state.attributes.event_type
                 or (as_timestamp(trigger.to_state.state)
                     - as_timestamp(trigger.from_state.state)) > 1 }}
        sequence:
          - variables:
              wanted: "{{ 'locked_on' if trigger.id == 'lock_on' else 'locked_off' }}"
              new_mode: "{{ 'auto' if lock_mode == wanted else wanted }}"
              flash_color: "{{ [0, 255, 0] if new_mode == 'locked_on' else [255, 0, 0] }}"
              flash_count: 2
              flash_lights: >-
                {{ expand(feedback_lights) | selectattr('domain', 'eq', 'light')
                   | map(attribute='entity_id') | list }}
              flash_switches: >-
                {{ expand(feedback_lights) | selectattr('domain', 'eq', 'switch')
                   | map(attribute='entity_id') | list }}
              fb_was_off: >-
                {{ expand(feedback_lights) | selectattr('state', 'eq', 'off')
                   | map(attribute='entity_id') | list }}
              fb_restore_off: >-
                {{ (fb_was_off | reject('in', target_lights) | list)
                   if new_mode == 'locked_on' else fb_was_off }}
              fb_was_on_lights: "{{ flash_lights | reject('in', fb_was_off) | list }}"
              fb_was_on_switches: "{{ flash_switches | reject('in', fb_was_off) | list }}"

          # ---- Store lock state as in-memory scene flags ----
          - if: "{{ lock_mode != 'auto' }}"
            then:
              - action: scene.delete
                target:
                  entity_id: "scene.{{ lock_base }}_{{ lock_mode }}"
          - if: "{{ new_mode != 'auto' }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ lock_base }}_{{ new_mode }}"
                  snapshot_entities: "{{ target_lights }}"

          # ---- Flash feedback ----
          - if: "{{ feedback_enabled and feedback_lights | length > 0 }}"
            then:
              # Turn off lights on first (in their normal color) so the snapshot
              # captures their real state
              - if: "{{ fb_was_off | length > 0 }}"
                then:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ fb_was_off }}"
                  - wait_template: >-
                      {{ expand(fb_was_off) | selectattr('state', 'eq', 'off')
                         | list | count == 0 }}
                    timeout: "00:00:02"
                    continue_on_timeout: true
                  - delay:
                      milliseconds: 300
              - action: scene.create
                data:
                  scene_id: "{{ lock_base }}_flash"
                  snapshot_entities: "{{ feedback_lights }}"
              - if: "{{ new_mode == 'auto' }}"
                # Unlock: one blink in each light's own color
                # (lights that were on blink off; lights that were off already
                # blinked on via the step above)
                then:
                  - if: "{{ fb_was_on_lights | length > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ fb_was_on_lights }}"
                        data:
                          transition: 0
                  - if: "{{ fb_was_on_switches | length > 0 }}"
                    then:
                      - action: switch.turn_off
                        target:
                          entity_id: "{{ fb_was_on_switches }}"
                  - delay:
                      milliseconds: 200
                # Lock on/off: green/red blinks
                else:
                  - repeat:
                      count: "{{ flash_count }}"
                      sequence:
                        - if: "{{ flash_lights | length > 0 }}"
                          then:
                            - action: light.turn_on
                              target:
                                entity_id: "{{ flash_lights }}"
                              data:
                                rgb_color: "{{ flash_color }}"
                                brightness: 255
                                transition: 0
                        - if: "{{ flash_switches | length > 0 }}"
                          then:
                            - action: switch.turn_on
                              target:
                                entity_id: "{{ flash_switches }}"
                        - delay:
                            milliseconds: 200
                        # Leave lights ON after the last blink so the restore applies while on
                        # (Matter bulbs often ignore color changes while off)
                        - if: "{{ repeat.index < flash_count | int }}"
                          then:
                            - if: "{{ flash_lights | length > 0 }}"
                              then:
                                - action: light.turn_off
                                  target:
                                    entity_id: "{{ flash_lights }}"
                                  data:
                                    transition: 0
                            - if: "{{ flash_switches | length > 0 }}"
                              then:
                                - action: switch.turn_off
                                  target:
                                    entity_id: "{{ flash_switches }}"
                            - delay:
                                milliseconds: 150
              - action: scene.turn_on
                target:
                  entity_id: "scene.{{ lock_base }}_flash"
                data:
                  transition: 0
              - delay:
                  milliseconds: 300
              - if: "{{ fb_restore_off | length > 0 }}"
                then:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ fb_restore_off }}"

          # ---- Apply the new mode ----
          - choose:
              - conditions: "{{ new_mode == 'locked_on' }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
              - conditions: "{{ new_mode == 'locked_off' }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ target_lights }}"
              # Unlocked from locked_on: turn off now if the room's already been clear long enough
              - conditions:
                  - condition: template
                    value_template: >-
                      {% set sensors = expand(presence_sensors) %}
                      {{ new_mode == 'auto' and wanted == 'locked_on'
                         and sensors | selectattr('state', 'eq', 'on') | list | count == 0
                         and sensors | selectattr('last_changed', 'gt',
                              now() - timedelta(minutes=off_delay)) | list | count == 0 }}
                  - condition: and
                    conditions: !input off_conditions
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ target_lights }}"
              # Unlocked from locked_off: turn on now if someone's there
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ new_mode == 'auto' and wanted == 'locked_off'
                         and expand(presence_sensors) | selectattr('state', 'eq', 'on')
                             | list | count > 0 }}
                  - condition: and
                    conditions: !input on_conditions
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ target_lights }}"

      # ---- Motion ----
      - conditions:
          - condition: trigger
            id: motion
          - condition: template
            value_template: "{{ lock_mode != 'locked_off' }}"
          - condition: template
            value_template: >-
              {% set lights = expand(target_lights) %}
              {{ lights | selectattr('state', 'eq', 'on') | list | count > 0
                 or lights | selectattr('last_changed', 'gt',
                      now() - timedelta(seconds=manual_grace)) | list | count == 0 }}
          - condition: and
            conditions: !input on_conditions
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ target_lights }}"

      # ---- Clear ----
      - conditions:
          - condition: trigger
            id: clear
          - condition: template
            value_template: "{{ lock_mode != 'locked_on' }}"
          - condition: template
            value_template: >-
              {% set sensors = expand(presence_sensors) %}
              {{ sensors | selectattr('state', 'eq', 'on') | list | count == 0
                 and sensors | selectattr('last_changed', 'gt',
                      now() - timedelta(minutes=off_delay)) | list | count == 0 }}
          - condition: and
            conditions: !input off_conditions
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ target_lights }}"
